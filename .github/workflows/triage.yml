name: Nightly Job Triage

on:
  schedule:
    # 09:00 UTC ≈ 1–2am PT — safely after the day's last scrapes (the biotech
    # digest actually lands ~07:00 UTC under GH cron delay; LinkedIn's last
    # hourly run is ~04:17 UTC). Exact timing isn't critical: the agent scores
    # every not-yet-scored role in all_jobs.json, so stragglers from a delayed
    # scrape simply roll into the next night's run.
    - cron: "0 9 * * *"

  workflow_dispatch:

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  triage:
    name: Score new roles vs candidate profile
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Anthropic SDK
        run: pip install anthropic

      # Runner 1: Gemini Key 1
      - name: Run triage agent (Gemini Key 1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: python triage_agent.py --limit 100 --judge

      # Runner 2: Gemini Key 2
      - name: Run triage agent (Gemini Key 2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: python triage_agent.py --limit 100 --judge

      # Runner 3: Gemini Key 3
      - name: Run triage agent (Gemini Key 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_3 }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: python triage_agent.py --limit 100 --judge

      - name: Commit scores to repo
        run: |
          git config user.name  "JobBot"
          git config user.email "jobbot@users.noreply.github.com"
          python ci_commit_push.py \
            --message "chore: update fit scores [$(date -u '+%Y-%m-%d %H:%MZ')]" \
            scores.json
